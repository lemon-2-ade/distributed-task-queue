# Phase 2 added `api`, Phase 5 adds `worker`, Phase 16 adds
# `scheduler`, Phase 17 adds `outbox_relay`, Phase 18 adds
# `prometheus` and `grafana`, Phase 19 adds `jaeger`, on top of the
# Phase 1 infrastructure (postgres, rabbitmq, redis).
#
# Phase 19 note on `jaeger` and OTEL_EXPORTER_OTLP_ENDPOINT: the four
# application services don't list that env var under their own
# `environment:` blocks below because `env_file: .env` already
# injects it (and OTEL_TRACES_ENABLED) from .env/.env.example --
# same as METRICS_POLL_INTERVAL_SECONDS before it. Jaeger's OTLP
# receiver needs no health check gating here: OTLPSpanExporter runs
# on a background thread via BatchSpanProcessor (observability/
# tracing.py), so a service starting before Jaeger is merely a few
# dropped spans at startup, never a reason to block the service
# itself from coming up.
#
# Phase 18 note on worker/scheduler/outbox_relay's metrics ports:
# each process opens its own standalone prometheus_client HTTP
# listener (observability/metrics.py's start_metrics_server -- these
# three have no other HTTP server to mount onto, unlike the API, see
# services/api/metrics.py). `expose` (not `ports`) is deliberate:
# it documents the port and makes it reachable from `prometheus`
# over the compose network, without publishing it to the host --
# publishing would collide the moment any of these services is run
# with `--scale N>1`, since every replica would try to bind the same
# host port. See docs/metrics.md for the related, known gap around
# Prometheus actually scraping more than one replica of a scaled
# service in plain Docker Compose.
name: distributed-task-queue

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dtq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-dtq}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dtq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-dtq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-change-me}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # No separate metrics port -- /metrics is mounted on this same
    # app/port (services/api/main.py), already published above.

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
      REDIS_URL: ${REDIS_URL}
    expose:
      - "${WORKER_METRICS_PORT:-9101}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: docker/scheduler.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
    expose:
      - "${SCHEDULER_METRICS_PORT:-9102}"
    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

  outbox_relay:
    build:
      context: .
      dockerfile: docker/outbox-relay.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: ${RABBITMQ_URL}
    expose:
      - "${OUTBOX_RELAY_METRICS_PORT:-9103}"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api
      - worker
      - scheduler
      - outbox_relay

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      # No new user signs up for a demo project's Grafana.
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  jaeger:
    # all-in-one: Jaeger's collector, query service, and UI in one
    # container, backed by in-memory storage -- a real deployment
    # would point Jaeger at Elasticsearch/Cassandra/etc. instead, but
    # this project's traces only need to survive one docker-compose
    # session for the demo/teaching purpose they serve. See
    # docs/tracing.md.
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      # Jaeger's own built-in OTLP receiver -- see docs/tracing.md
      # for why this project sends traces straight here instead of
      # through a separate OpenTelemetry Collector.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC receiver

volumes:
  pgdata:
  rabbitmqdata:
  redisdata:
  prometheusdata:
  grafanadata:
